[package]
name = "deepseek-harness-desktop"
version = "0.2.0"
description = "DeepSeek Harness Desktop — native macOS/Windows shell for DeepSeek Harness 0.1.0-rc.6"
authors = ["renjianxin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cssparser = "0.36"
selectors = "0.36"
precomputed-hash = "0.1"
zstd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Unix-only: `libc` (process-group signalling) and `signal-hook` (termination
# signals) are referenced only under `#[cfg(unix)]`. Keeping them target-gated
# removes them entirely from the Windows build surface.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"
