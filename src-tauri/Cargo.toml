[package]
name = "harness-desktop"
version = "0.1.0"
description = "Harness Desktop — macOS launcher for DeepSeek Harness 0.1.0-rc.6"
authors = ["renjianxin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
signal-hook = "0.3"
